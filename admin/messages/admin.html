<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Messaging Panel</title>
    <link rel="stylesheet" href="messenger.css">
    <style>
        body { background: #f8fffb; font-family: Arial, sans-serif; }
        .admin-container { width: 95%; max-width: 1200px; margin: 28px auto; background: #fff; border-radius: 18px; box-shadow: 0 8px 32px rgba(0,0,0,0.08); padding: 0; display: flex; height: 80vh; min-height: 600px; }
        .admin-left { width: 300px; border-right: 1.5px solid #e5e7eb; display: flex; flex-direction: column; height: 100%; }
        .admin-header { background: #22c55e; color: #fff; font-size: 1.5rem; font-weight: bold; padding: 20px 24px; border-radius: 18px 0 0 0; }
        .header-controls { display:flex; gap:8px; align-items:center }
        .settings-btn { background: rgba(255,255,255,0.08); color:#fff; border:none; padding:6px 10px; border-radius:8px; cursor:pointer; font-weight:600 }
        .settings-panel { position:absolute; left:20px; top:68px; background:#fff; color:#111; border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,0.12); padding:12px; display:none; z-index:2147483649 }
        .settings-panel label{display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0}
        .ticket-list { display: flex; flex-direction: column; gap: 22px; padding: 22px 12px 22px 12px; overflow:auto; }
        .ticket-card {
            background: #fff;
            border-radius: 14px;
            width: 100%;
            min-height: 110px;
            box-shadow: 0 4px 24px rgba(34,197,94,0.10), 0 1.5px 0 #22c55e;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 18px;
            cursor: pointer;
            transition: box-shadow 0.2s, border 0.2s;
            border: 2px solid #e5e7eb;
            margin-bottom: 2px;
        }
        .ticket-card.selected, .ticket-card:hover {
            box-shadow: 0 6px 32px rgba(34,197,94,0.18), 0 2px 0 #22c55e;
            border: 2.5px solid #22c55e;
            background: #f0fdf4;
        }
        .ticket-unread { background:#ef4444;color:#fff;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:700;margin-left:8px;display:inline-block }
        .ticket-card.selected, .ticket-card:hover { box-shadow: 0 4px 16px rgba(34,197,94,0.12); border: 2px solid #22c55e; }
        .ticket-title { font-weight: 700; font-size: 11px; }
        .ticket-status { background: #22c55e; color: #fff; font-size: 11px; border-radius: 8px; padding: 2px 10px; display: inline-block; margin-top: 4px; }
        .ticket-date { font-size: 11px; color: #6b7280; margin-top: 10px; }
        .admin-right { flex: 1; display: flex; flex-direction: column; height: 100%; }
        .conversation-panel { display: none; flex-direction: column; height: 100%; min-height: 500px; }
        .conversation-panel.active { display: flex; flex-direction: column; height: 100%; }
        .conversation-header { background: #22c55e; color: #fff; padding: 16px 24px; font-weight: 700; display: flex; align-items: center; justify-content: space-between; border-radius: 0 18px 0 0; font-size: 1.25rem; }
        .close-conversation { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; }
        .messages-view { flex: 1; overflow-y: auto; padding: 18px 20px; background: #f8fffb; display: flex; flex-direction: column; align-items: stretch; gap: 12px; min-height: 0; }
        /* Override messenger.css which hides #messages-view */
        #messages-view { display: flex !important; }
        /* Ensure the message input stays at the bottom of the panel, not the page */
        .admin-message-form {
            width: 100%;
            display: flex;
            gap: 8px;
            padding: 12px 12px 16px 12px;
            box-sizing: border-box;
            border-top: 1.5px solid #e5e7eb;
            background: #fff;
            position: relative;
            margin-top: auto;
        }
                .admin-message-bubble {
                    background: #fff;
                    color: #222;
                    padding: 10px 14px;
                    border-radius: 14px;
                    min-width: 72px;
                    max-width: 70%;
                    width: auto;
                    overflow-wrap: break-word;
                    word-break: normal;
                    white-space: normal;
                    box-shadow: 0 1px 6px rgba(0,0,0,0.06);
                    font-size: 11px;
                    font-weight: 600;
                    margin-bottom: 0;
                    text-align: left;
                    box-sizing: border-box;
                }

                .admin-message-time { font-size: 11px; color: #6b7280; margin-top: 6px; }

                /* Responsive bubble sizing */
                @media (max-width: 1000px) {
                    .admin-message-bubble { max-width: 75%; font-size: 11px; }
                }

                @media (max-width: 700px) {
                    .admin-container { flex-direction: column; height: 100vh; }
                    .admin-left { width: 100%; border-right: none; border-bottom: 1.5px solid #e5e7eb; max-height: 220px; overflow:auto; }
                    .admin-right { width: 100%; }
                    .messages-view { padding: 12px; }
                    .admin-message-bubble { max-width: 85%; font-size: 11px; }
                    .admin-message-input { height:40px; font-size:13px; }
                }

                @media (max-width: 420px) {
                    .admin-message-bubble { max-width: 95%; font-size: 11px; padding: 8px 12px; }
                    .admin-message-time { font-size: 11px; }
                    .admin-header, .conversation-header { font-size: 1.05rem; padding: 12px 16px; }
                    .ticket-card { min-height: 84px; padding: 12px; }
                }
        /* (removed duplicate .admin-message-form rule) */
        .admin-message-input { flex: 1; border: 1.5px solid #e5e7eb; border-radius: 8px; padding: 12px 14px; font-size: 16px; height:44px; box-sizing:border-box; }
        .admin-send-btn { background: #22c55e; color: #fff; border: none; border-radius: 8px; padding: 10px 26px; font-weight: 700; font-size: 16px; height:44px; }
        /* Messenger icon bubble for messaging */
        #messenger-fab {
          position: fixed;
          bottom: 32px;
          right: 32px;
          width: 60px;
          height: 60px;
          background: #16a34a;
          color: #fff;
          border-radius: 50%;
          box-shadow: 0 4px 16px rgba(0,0,0,0.18);
          display: flex;
          align-items: center;
          justify-content: center;
          cursor: pointer;
          z-index: 2147483647;
          font-size: 32px;
          transition: background 0.2s;
          pointer-events: auto;
        }
        #messenger-fab:hover {
          background: #22c55e;
        }
    </style>
</head>
<body>
    <!-- Toast container for notifications (top-right) -->
    <div id="toast-container" style="position:fixed;right:20px;top:20px;z-index:2147483650;display:flex;flex-direction:column;gap:10px;pointer-events:none"></div>

    <div class="admin-container">
                <div class="admin-left">
                        <div style="position:relative;">
                            <div class="admin-header" style="display:flex;align-items:center;justify-content:space-between">
                                <span>Inquiries</span>
                                <div class="header-controls">
                                    <button class="settings-btn" id="settings-btn">Settings</button>
                                </div>
                            </div>
                            <div class="settings-panel" id="settings-panel">
                                <label><input type="checkbox" id="pref-toast" checked /> Show toasts</label>
                                <label><input type="checkbox" id="pref-sound" /> Play sound</label>
                                <label><input type="checkbox" id="pref-desktop" /> Desktop notifications</label>
                                <div style="font-size:12px;color:#666;margin-top:8px">Preferences saved in browser.</div>
                            </div>
                        </div>
            <div class="ticket-list" id="ticket-list"></div>
        </div>
        <div class="admin-right">
            <div class="conversation-panel" id="conversation-panel">
                <div class="conversation-header">
                    <span id="conversation-title">Ticket</span>
                    <button class="close-conversation" id="close-conversation">&times;</button>
                </div>
                <div class="messages-view" id="messages-view"></div>
                <form class="admin-message-form" id="message-form">
                    <input class="admin-message-input" id="message-input" type="text" placeholder="Type your message..." autocomplete="off" />
                    <button class="admin-send-btn" id="send-message" type="submit">Send</button>
                </form>
            </div>
        </div>
    </div>
    <!-- Messenger Floating Button removed for admin screen -->
    <script type="module" src="messenger-admin.js"></script>
</body>
</html>
